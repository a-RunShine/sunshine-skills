  <title id="tree-title">sunshine-skills — three cozy categories</title>
  <desc id="tree-desc">A warm cream board. Top header reads "SKILL TAXONOMY · 88 个小可爱住 3 个窝". Three large rounded tiles below show the categories: for-fun with a coral palette and zine/icon motif, lark-suite with a mint palette and chat-bubble motif, practical with a yellow palette and gear motif. Each tile lists a few representative skills as rounded chips and a small matchstick character waving from a corner.</desc>

