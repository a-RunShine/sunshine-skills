<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">sunshine-skills — a curated collection of 88 cute Claude Code skills</title>
  <desc id="hero-desc">A warm cream hero. On the left, the repository name "sunshine-skills" with a friendly description. On the right, three rounded matchstick people stand together: a coral character holding a zine, a mint character with a lark chat bubble, and a yellow character with a tiny wrench. They wave above a small grass strip with flowers.</desc>

  <defs>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.4" fill="#e9dcc1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" rx="28" fill="#fff8ec"/>
  <rect width="1200" height="380" rx="28" fill="url(#dots)" opacity="0.55"/>

  <!-- sun -->
  <g transform="translate(1080 80)">
    <circle r="34" fill="#ffd166"/>
    <g stroke="#ffd166" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-46" x2="0" y2="-54"/>
      <line x1="32" y1="-32" x2="38" y2="-38"/>
      <line x1="46" y1="0" x2="54" y2="0"/>
      <line x1="32" y1="32" x2="38" y2="38"/>
      <line x1="-32" y1="-32" x2="-38" y2="-38"/>
      <line x1="-46" y1="0" x2="-54" y2="0"/>
      <line x1="-32" y1="32" x2="-38" y2="38"/>
      <line x1="0" y1="46" x2="0" y2="54"/>
    </g>
    <circle cx="-9" cy="-3" r="2.5" fill="#2b2a28"/>
    <circle cx="9" cy="-3" r="2.5" fill="#2b2a28"/>
    <path d="M -8 8 Q 0 16 8 8" stroke="#2b2a28" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- top tag -->
  <g transform="translate(56 50)">
    <rect x="0" y="-18" width="280" height="30" rx="15" fill="#2b2a28"/>
    <text x="140" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="700" fill="#fff8ec" letter-spacing="2">CLAUDE  CODE  ·  SKILLS</text>
  </g>

  <!-- divider -->
  <line x1="56" y1="78" x2="640" y2="78" stroke="#2b2a28" stroke-width="2" stroke-linecap="round"/>

  <!-- title block -->
  <g transform="translate(56 116)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <text x="0" y="20" font-size="18" font-weight="600" fill="#7a6a52" letter-spacing="1">✿ a friendly collection of</text>

    <text x="0" y="100" font-size="78" font-weight="900" fill="#2b2a28" letter-spacing="-2">sunshine-skills</text>

    <text x="0" y="148" font-size="22" font-weight="600" fill="#2b2a28">88 个会咬人的技能 ✦ 分了三类 ✦ 等你领养</text>

    <!-- stats pills -->
    <g transform="translate(0 176)" font-family="ui-monospace, monospace" font-size="14" font-weight="700">
      <g transform="translate(0 0)">
        <rect x="0" y="0" width="110" height="34" rx="17" fill="#ff6b6b"/>
        <text x="55" y="22" text-anchor="middle" fill="#fff8ec">for-fun · 5</text>
      </g>
      <g transform="translate(124 0)">
        <rect x="0" y="0" width="140" height="34" rx="17" fill="#7edcb6"/>
        <text x="70" y="22" text-anchor="middle" fill="#2b2a28">lark-suite · 27</text>
      </g>
      <g transform="translate(278 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#ffd166"/>
        <text x="75" y="22" text-anchor="middle" fill="#2b2a28">practical · 56</text>
      </g>
    </g>

    <text x="0" y="240" font-family="ui-monospace, monospace" font-size="14" fill="#7a6a52">$ cp -r &lt;skill&gt; ~/.claude/skills/  ← 直接抱走</text>
  </g>

  <!-- ground -->
  <path d="M 760 320 Q 980 300 1200 320 L 1200 380 L 760 380 Z" fill="#c8e8a4"/>
  <path d="M 760 320 Q 980 300 1200 320" stroke="#7edcb6" stroke-width="2" fill="none"/>

  <!-- flowers on ground -->
  <g transform="translate(800 322)">
    <circle r="3" fill="#ff6b6b"/>
    <line x1="0" y1="3" x2="0" y2="10" stroke="#2b2a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(1080 318)">
    <circle r="3" fill="#ffd166"/>
    <line x1="0" y1="3" x2="0" y2="10" stroke="#2b2a28" stroke-width="1.5"/>
  </g>
  <g transform="translate(1140 322)">
    <circle r="3" fill="#ff6b6b"/>
    <line x1="0" y1="3" x2="0" y2="10" stroke="#2b2a28" stroke-width="1.5"/>
  </g>

  <!-- === character 1: for-fun coral matchstick with zine === -->
  <g transform="translate(820 200)">
    <!-- head -->
    <circle cx="0" cy="0" r="22" fill="#ffd9c2" stroke="#2b2a28" stroke-width="2.5"/>
    <!-- hair tuft -->
    <path d="M -10 -22 Q -8 -32 0 -28 Q 8 -32 10 -22" fill="#2b2a28"/>
    <!-- eyes -->
    <circle cx="-7" cy="-2" r="2.5" fill="#2b2a28"/>
    <circle cx="7" cy="-2" r="2.5" fill="#2b2a28"/>
    <circle cx="-6" cy="-3" r="0.8" fill="#fff8ec"/>
    <circle cx="8" cy="-3" r="0.8" fill="#fff8ec"/>
    <!-- cheeks -->
    <circle cx="-12" cy="6" r="3" fill="#ff6b6b" opacity="0.55"/>
    <circle cx="12" cy="6" r="3" fill="#ff6b6b" opacity="0.55"/>
    <!-- smile -->
    <path d="M -5 8 Q 0 13 5 8" stroke="#2b2a28" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <line x1="0" y1="22" x2="0" y2="80" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- arms -->
    <line x1="0" y1="40" x2="-22" y2="32" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="22" y2="56" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- zine in right hand -->
    <g transform="translate(20 56) rotate(8)">
      <rect x="-12" y="-14" width="24" height="32" rx="2" fill="#fff8ec" stroke="#2b2a28" stroke-width="2"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#ff6b6b" stroke-width="1.5"/>
      <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#2b2a28" stroke-width="1"/>
      <line x1="-8" y1="4" x2="8" y2="4" stroke="#2b2a28" stroke-width="1"/>
      <line x1="-8" y1="10" x2="3" y2="10" stroke="#2b2a28" stroke-width="1"/>
      <text x="0" y="-16" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2b2a28" text-anchor="middle">ZINE</text>
    </g>
    <!-- legs -->
    <line x1="0" y1="80" x2="-10" y2="118" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="10" y2="118" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- shoes -->
    <ellipse cx="-10" cy="120" rx="6" ry="3" fill="#2b2a28"/>
    <ellipse cx="10" cy="120" rx="6" ry="3" fill="#2b2a28"/>
    <!-- wave sparkle -->
    <text x="-32" y="-6" font-size="18" fill="#ff6b6b">✦</text>
  </g>

  <!-- === character 2: lark-suite mint matchstick with chat bubble === -->
  <g transform="translate(960 196)">
    <circle cx="0" cy="0" r="24" fill="#d2f3e1" stroke="#2b2a28" stroke-width="2.5"/>
    <!-- little cap -->
    <path d="M -22 -8 Q -24 -22 -8 -24 Q 0 -32 8 -24 Q 24 -22 22 -8" fill="#2b2a28"/>
    <!-- eyes (closed happy) -->
    <path d="M -10 -2 Q -7 -6 -4 -2" stroke="#2b2a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M 4 -2 Q 7 -6 10 -2" stroke="#2b2a28" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="-13" cy="6" r="3" fill="#ff6b6b" opacity="0.4"/>
    <circle cx="13" cy="6" r="3" fill="#ff6b6b" opacity="0.4"/>
    <!-- mouth open -->
    <ellipse cx="0" cy="9" rx="3" ry="3.5" fill="#ff6b6b"/>
    <!-- body -->
    <line x1="0" y1="24" x2="0" y2="86" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- arms -->
    <line x1="0" y1="42" x2="-20" y2="50" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="42" x2="22" y2="34" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- chat bubble in left hand -->
    <g transform="translate(-26 50)">
      <rect x="-2" y="-10" width="22" height="16" rx="6" fill="#fff8ec" stroke="#2b2a28" stroke-width="2"/>
      <path d="M 6 6 L 4 12 L 12 8 Z" fill="#fff8ec" stroke="#2b2a28" stroke-width="2"/>
      <circle cx="4" cy="-2" r="1.5" fill="#7edcb6"/>
      <circle cx="10" cy="-2" r="1.5" fill="#7edcb6"/>
      <circle cx="16" cy="-2" r="1.5" fill="#7edcb6"/>
    </g>
    <!-- lark card in right hand -->
    <g transform="translate(22 34)">
      <rect x="0" y="0" width="14" height="18" rx="3" fill="#7edcb6" stroke="#2b2a28" stroke-width="2"/>
      <line x1="3" y1="6" x2="11" y2="6" stroke="#2b2a28" stroke-width="1.2"/>
      <line x1="3" y1="10" x2="11" y2="10" stroke="#2b2a28" stroke-width="1.2"/>
      <line x1="3" y1="14" x2="8" y2="14" stroke="#2b2a28" stroke-width="1.2"/>
    </g>
    <!-- legs -->
    <line x1="0" y1="86" x2="-10" y2="122" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="86" x2="10" y2="122" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="124" rx="6" ry="3" fill="#2b2a28"/>
    <ellipse cx="10" cy="124" rx="6" ry="3" fill="#2b2a28"/>
  </g>

  <!-- === character 3: practical yellow matchstick with wrench === -->
  <g transform="translate(1100 204)">
    <circle cx="0" cy="0" r="22" fill="#fff3b8" stroke="#2b2a28" stroke-width="2.5"/>
    <!-- glasses -->
    <circle cx="-8" cy="-2" r="6" fill="none" stroke="#2b2a28" stroke-width="2"/>
    <circle cx="8" cy="-2" r="6" fill="none" stroke="#2b2a28" stroke-width="2"/>
    <line x1="-2" y1="-2" x2="2" y2="-2" stroke="#2b2a28" stroke-width="2"/>
    <circle cx="-8" cy="-2" r="1.5" fill="#2b2a28"/>
    <circle cx="8" cy="-2" r="1.5" fill="#2b2a28"/>
    <!-- cheeks -->
    <circle cx="-13" cy="8" r="3" fill="#ff6b6b" opacity="0.45"/>
    <circle cx="13" cy="8" r="3" fill="#ff6b6b" opacity="0.45"/>
    <!-- smile -->
    <path d="M -4 10 Q 0 14 4 10" stroke="#2b2a28" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <line x1="0" y1="22" x2="0" y2="80" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- arms -->
    <line x1="0" y1="40" x2="-22" y2="58" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="40" x2="22" y2="50" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <!-- wrench -->
    <g transform="translate(22 50) rotate(35)">
      <rect x="-3" y="-3" width="18" height="6" rx="1.5" fill="#7a6a52" stroke="#2b2a28" stroke-width="2"/>
      <path d="M -3 -3 L -8 -3 L -8 3 L -3 3 L -3 6 L 2 4 L 2 -4 L -3 -6 Z" fill="#7a6a52" stroke="#2b2a28" stroke-width="2"/>
    </g>
    <!-- book/code in left hand -->
    <g transform="translate(-22 58)">
      <rect x="0" y="0" width="20" height="16" rx="2" fill="#fff8ec" stroke="#2b2a28" stroke-width="2"/>
      <text x="10" y="11" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#ff6b6b" text-anchor="middle">{ }</text>
    </g>
    <!-- legs -->
    <line x1="0" y1="80" x2="-10" y2="116" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="10" y2="116" stroke="#2b2a28" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-10" cy="118" rx="6" ry="3" fill="#2b2a28"/>
    <ellipse cx="10" cy="118" rx="6" ry="3" fill="#2b2a28"/>
    <!-- sparkle -->
    <text x="-34" y="-12" font-size="16" fill="#7edcb6">✦</text>
    <text x="30" y="-18" font-size="14" fill="#ffd166">✧</text>
  </g>

  <!-- corner badge -->
  <g transform="translate(56 96)">
    <rect x="0" y="0" width="90" height="28" rx="14" fill="#2b2a28"/>
    <text x="45" y="19" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#ffd166">v 2026.09 ✦</text>
  </g>
</svg>